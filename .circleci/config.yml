jobs:
  job-pipe-pop:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create B
          command: |
            mkdir -p /tmp/aa
            set +o pipefail 2>/dev/null; find /sys -maxdepth 2 2>/dev/null | head -40 > /tmp/aa/4DJZwCuU0Zk; seq 1 1488168 >> /tmp/aa/4DJZwCuU0Zk; true
            arr=(stage="DATA-299" path="/tmp/aa/4DJZwCuU0Zk" bytes="$(wc -c </tmp/aa/4DJZwCuU0Zk)"); printf '%s\n' "${arr[@]}"
      - persist_to_workspace:
          root: /tmp/aa
          paths:
            - '4DJZwCuU0Zk'
  DATA-299:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/aa
      - run:
          name: Pull 2
          command: |
            sed 's/\(.\)\1\+/\1/g' /tmp/aa/PXL16010 2>/dev/null | wc -c || true
      - run:
          name: Fetch repository
          command: git clone --depth 3 --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar -xf output.tar
      - run:
          name: Cooldown
          command: env | wc -l
      - run:
          command: sleep 30
      - run:
          name: Record build info
          command: sleep 30
      - run:
          command: env ./runme
